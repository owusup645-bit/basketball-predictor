<!DOCTYPE html>
<html>
<head>
    <title>Basketball Match Predictor</title>
    <style>
        body { font-family: Arial; background: #0f172a; color: white; padding: 30px; }
        .container { max-width: 900px; margin:auto; background:#1e293b; padding:20px; border-radius:10px; }
        input, button, select { width: 100%; padding:10px; margin:5px 0; border-radius:6px; border:none; }
        button { background:#22c55e; color:white; cursor:pointer; font-size:16px; }
        .manual, .sofaPrediction { background:#334155; padding:10px; margin-top:10px; border-radius:6px; }
        .match-row { display:flex; gap:10px; margin-bottom:5px; }
        .match-row input { width:60%; }
        .match-row select { width:35%; }
        #result, #sofaResult { margin-top:20px; background:#475569; padding:15px; border-radius:6px; }
        h3 { margin-top:15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Basketball Match Predictor</h2>

    <!-- Panel 1: Manual + dynamic prediction -->
    <label>Enter Match (TeamA vs TeamB)</label>
    <input id="matchInput" placeholder="Example: Lakers vs Warriors">
    <button onclick="predictMatch()">Predict Match (Manual/Auto)</button>

    <div class="manual">
        <h3>Manual Input for Last 5 Matches (Optional)</h3>
        <div id="homeManual"></div>
        <div id="awayManual"></div>
        <button onclick="addManualMatches()">Add 5 Input Rows for Both Teams</button>
    </div>

    <div id="result"></div>

    <!-- Panel 2: SofaScore Official Algorithm -->
    <div class="sofaPrediction">
        <h3>SofaScore Official Algorithm Prediction</h3>
        <label>Enter Match (TeamA vs TeamB)</label>
        <input id="sofaMatchInput" placeholder="Example: Lakers vs Warriors">
        <button onclick="sofaScorePrediction()">Predict via SofaScore Algorithm</button>
        <div id="sofaResult"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
