<!DOCTYPE html>
<html>

<head>
<title>Basketball Prediction Tool</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
padding:30px;
}

.container{
max-width:600px;
margin:auto;
background:#1e293b;
padding:25px;
border-radius:10px;
}

input,select,button{
width:100%;
padding:10px;
margin-top:8px;
margin-bottom:15px;
border-radius:6px;
border:none;
}

button{
background:#22c55e;
color:white;
font-size:16px;
cursor:pointer;
}

.result{
margin-top:20px;
background:#334155;
padding:15px;
border-radius:8px;
}

</style>
</head>

<body>

<div class="container">

<h2>Basketball Prediction Tool</h2>

<label>Tournament</label>
<input id="tournament">

<label>Home Team</label>
<input id="homeTeam">

<label>Away Team</label>
<input id="awayTeam">

<h3>Home Last 5 Points</h3>

<input id="h1">
<input id="h2">
<input id="h3">
<input id="h4">
<input id="h5">

<h3>Home Results</h3>

<select id="hr1">
<option>win</option>
<option>loss</option>
</select>

<select id="hr2">
<option>win</option>
<option>loss</option>
</select>

<select id="hr3">
<option>win</option>
<option>loss</option>
</select>

<select id="hr4">
<option>win</option>
<option>loss</option>
</select>

<select id="hr5">
<option>win</option>
<option>loss</option>
</select>

<h3>Away Last 5 Points</h3>

<input id="a1">
<input id="a2">
<input id="a3">
<input id="a4">
<input id="a5">

<h3>Away Results</h3>

<select id="ar1">
<option>win</option>
<option>loss</option>
</select>

<select id="ar2">
<option>win</option>
<option>loss</option>
</select>

<select id="ar3">
<option>win</option>
<option>loss</option>
</select>

<select id="ar4">
<option>win</option>
<option>loss</option>
</select>

<select id="ar5">
<option>win</option>
<option>loss</option>
</select>

<button onclick="analyze()">Analyze Match</button>

<div class="result" id="output"></div>

</div>

<script>

function calculate(points,results){

let total=0
let adjust=0

for(let i=0;i<5;i++){

total+=points[i]

if(results[i]=="win"){
adjust+=0.5
}else{
adjust-=1.5
}

}

let avg=total/5

return avg+adjust

}

function analyze(){

let homePoints=[
Number(h1.value),
Number(h2.value),
Number(h3.value),
Number(h4.value),
Number(h5.value)
]

let homeResults=[
hr1.value,
hr2.value,
hr3.value,
hr4.value,
hr5.value
]

let awayPoints=[
Number(a1.value),
Number(a2.value),
Number(a3.value),
Number(a4.value),
Number(a5.value)
]

let awayResults=[
ar1.value,
ar2.value,
ar3.value,
ar4.value,
ar5.value
]

let homeScore=calculate(homePoints,homeResults)
let awayScore=calculate(awayPoints,awayResults)

let prediction=""

if(homeScore>awayScore){
prediction="Home Team Advantage"
}else{
prediction="Away Team Advantage"
}

output.innerHTML=`

<h3>Results</h3>

Home Score: ${homeScore.toFixed(2)} <br>
Away Score: ${awayScore.toFixed(2)} <br><br>

Prediction: <b>${prediction}</b>

`

}

</script>

</body>
</html>
